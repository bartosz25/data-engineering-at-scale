services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
