resources:
  jobs:
    sample_job:
      name: sample_job
      tasks:
        - task_key: python_wheel_task
          python_wheel_task:
            package_name: demo
            entry_point: main
            named_parameters:
              job_name: "{{job.name}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl